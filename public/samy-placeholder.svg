<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" role="img" aria-label="Silhouette d'un malinois belge">
  <defs>
    <linearGradient id="bg" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#fef3c7"/>
      <stop offset="1" stop-color="#fed7aa"/>
    </linearGradient>
  </defs>
  <rect width="400" height="500" fill="url(#bg)"/>
  <g transform="translate(60,80)" fill="#44403c">
    <!-- stylized malinois head -->
    <path d="M140 20
             C110 20 90 40 85 70
             C75 65 60 75 55 95
             C50 115 60 135 80 140
             L85 160
             C85 185 100 205 130 215
             L135 240
             C135 260 145 275 165 280
             L170 310
             L155 335
             L190 345
             L200 320
             L235 325
             L245 300
             L250 265
             C275 255 285 230 280 205
             L285 180
             C300 170 305 150 300 130
             C295 110 280 100 265 100
             L255 75
             C245 50 220 30 190 25
             Z"/>
    <!-- ear highlight -->
    <path d="M90 40 L75 15 L105 25 Z" fill="#78350f"/>
    <path d="M240 35 L265 10 L250 50 Z" fill="#78350f"/>
    <!-- eye -->
    <circle cx="150" cy="130" r="6" fill="#faf7f2"/>
    <circle cx="200" cy="130" r="6" fill="#faf7f2"/>
    <!-- muzzle -->
    <rect x="150" y="175" width="55" height="30" rx="12" fill="#1c1917"/>
    <circle cx="177" cy="180" r="6" fill="#1c1917"/>
  </g>
  <text x="200" y="470" text-anchor="middle" fill="#78350f" font-family="Georgia, serif" font-size="20" font-style="italic">Samy — placeholder</text>
</svg>
